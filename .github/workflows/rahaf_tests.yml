
name: Khota - Task 4 Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-task-4:
    name: Test Photo Guide and Report Status UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run Task 4 tests
        run: flutter test test/add_photottest.dart --reporter expanded
